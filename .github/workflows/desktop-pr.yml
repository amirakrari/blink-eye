name: Desktop PR checks

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - fix/linux-tray-session-bus
      - fix/close-to-tray-upstream
      - feat/wayland-reminder-overlays

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.platform }}, ${{ matrix.target }})
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
    defaults:
      run:
        shell: bash
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "lts/*"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Record host and target
        run: |
          uname -a
          rustc -vV
          cargo --version
          bun --version
          echo "Compilation target: ${{ matrix.target }}"
      - name: Install Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install frozen frontend dependencies
        run: bun install --frozen-lockfile
      - name: Test native host library
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build frontend and native host
        run: bun run build && cargo build --manifest-path src-tauri/Cargo.toml
      - name: Build target executable without bundles
        run: bun run tauri build --no-bundle --ci --target ${{ matrix.target }}
